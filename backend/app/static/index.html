<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinicOps AI - Review Queue</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; background: #f5f7fa; color: #1a2330; }
  h1 { margin-bottom: 4px; }
  .sub { color: #5b6b7d; margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .meta { font-size: 13px; color: #5b6b7d; margin-bottom: 6px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e8eef5; margin-right: 6px; }
  .tag.emergency { background: #fde2e2; color: #a11; }
  .body { font-size: 16px; margin: 8px 0 12px; }
  input { width: 100%; padding: 8px; border: 1px solid #c8d1db; border-radius: 6px; box-sizing: border-box; margin-bottom: 8px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 8px; }
  .approve { background: #1f8a4c; color: #fff; }
  .reject { background: #c0392b; color: #fff; }
  .empty { color: #5b6b7d; text-align: center; padding: 32px; }
  h2 { margin-top: 32px; font-size: 18px; }
  .log { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e6ebf0; }
</style>
</head>
<body>
  <h1>ClinicOps AI</h1>
  <div class="sub">Review queue: items the AI was not sure about, and all emergencies. Synthetic data only.</div>

  <h2>Messages to review</h2>
  <div id="queue"></div>

  <h2>Documents to review</h2>

  <div id="docqueue"></div>

  <h2>Recent audit log</h2>
  <div id="audit"></div>

<script>
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

async function loadQueue() {
  const res = await fetch("/review");
  const items = await res.json();
  const box = document.getElementById("queue");
  if (!items.length) {
    box.innerHTML = '<div class="card empty">Nothing waiting for review.</div>';
    return;
  }
  box.innerHTML = items.map(m => `
    <div class="card">
      <div class="meta">
        <span class="tag ${esc(m.category)}">${esc(m.category || "unknown")}</span>
        confidence ${esc(m.confidence)} &middot; from ${esc(m.sender)} &middot; message #${esc(m.id)}
      </div>
      <div class="body">${esc(m.body)}</div>
      <input id="note-${m.id}" placeholder="Note (what did you do?)">
      <button class="approve" onclick="decide(${m.id}, 'approved')">Approve</button>
      <button class="reject" onclick="decide(${m.id}, 'rejected')">Reject</button>
    </div>`).join("");
}


async function decide(id, decision) {
  const note = document.getElementById("note-" + id).value;
  const res = await fetch("/review/" + id, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision, note, reviewer: "staff" })
  });
  if (!res.ok) {
    const err = await res.json();
    alert("Error: " + (err.detail || res.status));
  }
  refresh();
}

async function loadDocs() {
  const res = await fetch("/review/documents");
  const docs = await res.json();
  const box = document.getElementById("docqueue");
  if (!docs.length) {
    box.innerHTML = '<div class="card empty">No documents waiting for review.</div>';
    return;
  }
  box.innerHTML = docs.map(d => `
    <div class="card">
      <div class="meta">
        <span class="tag">document</span>
        confidence ${esc(d.confidence)} &middot; ${esc(d.filename)} &middot; #${esc(d.id)}
      </div>
      <div class="body">
        Patient: ${esc(d.patient_name || "(missing)")}<br>
        Insurer: ${esc(d.insurance_provider || "(missing)")}<br>

        Policy: ${esc(d.policy_number || "(missing)")}<br>
        Referral date: ${esc(d.referral_date || "(missing)")}<br>
        Doctor: ${esc(d.doctor || "(missing)")}
      </div>
      <input id="docnote-${d.id}" placeholder="Note (what did you check?)">
      <button class="approve" onclick="decideDoc(${d.id}, 'approved')">Approve</button>
      <button class="reject" onclick="decideDoc(${d.id}, 'rejected')">Reject</button>
    </div>`).join("");
}

async function decideDoc(id, decision) {
  const note = document.getElementById("docnote-" + id).value;
  const res = await fetch("/review/documents/" + id, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision, note, reviewer: "staff" })
  });
  if (!res.ok) {
    const err = await res.json();
    alert("Error: " + (err.detail || res.status));
  }
  refresh();
}

async function loadAudit() {
  const res = await fetch("/audit");
  const logs = (await res.json()).slice(0, 10);
  document.getElementById("audit").innerHTML = logs.map(l =>
    `<div class="log"><b>${esc(l.actor)}</b> &middot; ${esc(l.action)} &middot; ${esc(l.details)}</div>`
  ).join("");
}


function refresh() { loadQueue(); loadDocs(); loadAudit(); }
refresh();
</script>
</body>
</html>
